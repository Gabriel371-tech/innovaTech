<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovatech | Produtos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Gestão de Produtos</h1>
    </header>
    <nav>
        <a th:href="@{/home}">Início</a>
        <a th:href="@{/alunos/listar}">Alunos</a>
        <a th:href="@{/cursos/listar}">Cursos</a>
        <a th:href="@{/professores/listar}">Professores</a>
        <a th:href="@{/disciplinas/listar}">Disciplinas</a>
        <a th:href="@{/produtos/listar}">Produtos</a>
        <a th:href="@{/pedidos/listar}">Pedidos</a>
        <a th:href="@{/relatorios}">Relatórios</a>
    </nav>

    <main class="container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Lista de Produtos</h2>
                <a th:href="@{/produtos/criar}" class="btn btn-success">Novo Produto</a>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.nomeProduto}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(produto.precoProduto, 1, 2, 'COMMA')}"></td>
                        <td th:text="${produto.estoqueProduto}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/produtos/editar/{id}(id=${produto.idProduto})}" class="btn btn-primary btn-sm">Editar</a>
                                <a th:href="@{/produtos/excluir/{id}(id=${produto.idProduto})}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Tem certeza que deseja excluir este produto?')">Excluir</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="4" style="text-align: center;">Nenhum produto cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
