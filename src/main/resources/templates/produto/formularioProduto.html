<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovatech | Formulário Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Gestão de Produtos</h1>
    </header>
    <nav>
        <a th:href="@{/inovatech}">Início</a>
        <a th:href="@{/produtos/listar}">Voltar para Lista</a>
    </nav>

    <main class="container">
        <div class="card">
            <h2 th:text="${produto.idProduto != null ? 'Editar Produto' : 'Novo Produto'}"></h2>
            
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{idProduto}">
                
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" th:field="*{nomeProduto}" required>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" th:field="*{precoProduto}" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="estoque">Estoque</label>
                        <input type="number" id="estoque" th:field="*{estoqueProduto}" required>
                    </div>
                </div>

                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    <a th:href="@{/produtos/listar}" class="btn btn-secondary" style="text-decoration: none; padding: 0.8rem 1.5rem; display: inline-block;">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
