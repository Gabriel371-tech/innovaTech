<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Esqueceu a Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .msg-erro {
            margin-top: 15px;
            padding: 10px;
            background-color: #fdecea;
            border: 1px solid #f44336;
            border-radius: 4px;
            color: #f44336;
            text-align: center;
        }

        .msg-sucesso {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            color: #4CAF50;
            text-align: center;
        }

        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #333;
        }

        .link-voltar a {
            color: #4CAF50;
        }
    </style>
</head>
<body>

<h1>Esqueceu a Senha</h1>

<form th:action="@{/forgot_password}" method="post">

    <div th:if="${error}" class="msg-erro" th:text="${error}"></div>
    <div th:if="${message}" class="msg-sucesso" th:text="${message}"></div>

    <p style="text-align: center; color: #666;">Digite seu endereço para receber uma hiperligação de redefinição de senha.</p>

    <label for="email">Endereço eletrônico</label>
    <input type="email" id="email" name="email" placeholder="usuario@exemplo.com" required/>

    <button type="submit">Enviar</button>

    <span class="link-voltar">
            <a th:href="@{/login}">Voltar para o Login</a>
        </span>

</form>

</body>
</html>
