<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovatech | Formulário Professor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Gestão de Professores</h1>
    </header>
    <nav>
        <a th:href="@{/inovatech}">Início</a>
        <a th:href="@{/professores/listar}">Voltar para Lista</a>
    </nav>

    <main class="container">
        <div class="card">
            <h2 th:text="${professor.idProfessor != null ? 'Editar Professor' : 'Novo Professor'}"></h2>
            
            <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">
                <input type="hidden" th:field="*{idProfessor}">
                
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" th:field="*{nomeProfessor}" required>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" th:field="*{emailProfessor}">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" th:field="*{telefoneProfessor}" required>
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" th:field="*{cpfProfessor}" required>
                    </div>
                    <div class="form-group">
                        <label for="especialidade">Especialidade</label>
                        <input type="text" id="especialidade" th:field="*{especialidade}" required>
                    </div>
                </div>

                <div class="form-row" style="display: grid; grid-template-columns: 1fr 2fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" th:field="*{cidadeProfessor}" required>
                    </div>
                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <input type="text" id="endereco" th:field="*{enderecoProfessor}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="curso">Curso Vinculado</label>
                    <select id="curso" th:field="*{curso}" required>
                        <option value="">Selecione um curso...</option>
                        <option th:each="curso : ${cursos}" 
                                th:value="${curso.idCurso}" 
                                th:text="${curso.nomeCurso}"></option>
                    </select>
                </div>

                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Salvar Professor</button>
                    <a th:href="@{/professores/listar}" class="btn btn-secondary" style="text-decoration: none; padding: 0.8rem 1.5rem; display: inline-block;">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
