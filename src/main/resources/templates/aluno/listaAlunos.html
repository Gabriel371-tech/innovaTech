<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovatech | Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Gestão de Alunos</h1>
    </header>
    <nav>
        <a th:href="@{/home}">Início</a>
        <a th:href="@{/alunos/listar}">Alunos</a>
        <a th:href="@{/cursos/listar}">Cursos</a>
        <a th:href="@{/professores/listar}">Professores</a>
        <a th:href="@{/disciplinas/listar}">Disciplinas</a>
        <a th:href="@{/produtos/listar}">Produtos</a>
        <a th:href="@{/pedidos/listar}">Pedidos</a>
        <a th:href="@{/relatorios}">Relatórios</a>
    </nav>

    <main class="container">
        <div class="card">
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 1rem;">
                <h2>Lista de Alunos</h2>
                <div style="margin-left: auto; display: flex; gap: 10px;">
                    <a th:href="@{/relatorios/alunos/pdf}" class="btn btn-secondary">Exportar PDF</a>
                    <a th:href="@{/alunos/criar}" class="btn btn-success">Novo Aluno</a>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>CPF</th>
                        <th>Cidade</th>
                        <th>Curso</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${alunos}">
                        <td th:text="${aluno.nomeAluno}"></td>
                        <td th:text="${aluno.emailAluno}"></td>
                        <td th:text="${aluno.telefoneAluno}"></td>
                        <td th:text="${aluno.cpfAluno}"></td>
                        <td th:text="${aluno.cidadeAluno}"></td>
                        <td th:text="${aluno.curso != null ? aluno.curso.nomeCurso : 'N/A'}"></td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/relatorios/aluno/{id}/pdf(id=${aluno.idAluno})}" class="btn btn-secondary btn-sm" target="_blank">Ficha PDF</a>
                                <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}" class="btn btn-primary btn-sm">Editar</a>
                                <a th:href="@{/alunos/excluir/{id}(id=${aluno.idAluno})}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Tem certeza que deseja excluir este aluno?')">Excluir</a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(alunos)}">
                        <td colspan="7" style="text-align: center;">Nenhum aluno cadastrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
