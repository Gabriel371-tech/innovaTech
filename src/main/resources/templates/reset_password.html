<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .msg-erro {
            margin-top: 15px;
            padding: 10px;
            background-color: #fdecea;
            border: 1px solid #f44336;
            border-radius: 4px;
            color: #f44336;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Redefinir Senha</h1>

<form th:action="@{/reset_password}" method="post">

    <div th:if="${error}" class="msg-erro" th:text="${error}"></div>

    <input type="hidden" name="token" th:value="${token}" />

    <label for="password">Digite a nova senha:</label>
    <input type="password" id="password" name="password" placeholder="Nova senha" required autofocus />

    <label for="confirmPassword">Digite novamente a senha nova:</label>
    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme a nova senha" required />

    <button type="submit">Salvar</button>

</form>

</body>
</html>
