<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .msg-erro {
            margin-top: 15px;
            padding: 10px;
            background-color: #fdecea;
            border: 1px solid #f44336;
            border-radius: 4px;
            color: #f44336;
            text-align: center;
        }

        .msg-logout {
            margin-top: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            color: #4CAF50;
            text-align: center;
        }

        .link-cadastro {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #333;
        }

        .link-cadastro a {
            color: #4CAF50;
        }
    </style>
</head>
<body>

<h1>Login</h1>

<form th:action="@{/login}" method="post">

    <div th:if="${param.error}" class="msg-erro">
        E-mail ou senha incorretos.
    </div>

    <div th:if="${param.logout}" class="msg-logout">
        Você saiu do sistema com sucesso.
    </div>

    <label for="emailUsuario">E-mail</label>
    <input type="email" id="emailUsuario" name="username" placeholder="email@exemplo.com" required />

    <label for="senhaUsuario">Senha</label>
    <input type="password" id="senhaUsuario" name="password" placeholder="Senha" required />

    <button type="submit">Entrar</button>

    <span class="link-cadastro">
            Não tem conta? <a href="/usuarios/novo">Cadastre-se</a>
        </span>

</form>

</body>
</html>
