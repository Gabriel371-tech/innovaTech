<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inovatech | Formulário Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <h1>Gestão de Disciplinas</h1>
    </header>
    <nav>
        <a th:href="@{/inovatech}">Início</a>
        <a th:href="@{/disciplinas/listar}">Voltar para Lista</a>
    </nav>

    <main class="container">
        <div class="card">
            <h2 th:text="${disciplina.idDisciplina != null ? 'Editar Disciplina' : 'Nova Disciplina'}"></h2>
            
            <form th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">
                <input type="hidden" th:field="*{idDisciplina}">
                
                <div class="form-group">
                    <label for="nome">Nome da Disciplina</label>
                    <input type="text" id="nome" th:field="*{nomeDisciplina}" required>
                </div>

                <div class="form-group">
                    <label for="carga">Carga Horária (horas)</label>
                    <input type="number" id="carga" th:field="*{cargaHoraria}" required min="1">
                </div>

                <div class="form-group">
                    <label for="curso">Curso</label>
                    <select id="curso" th:field="*{curso}" required>
                        <option value="">Selecione um curso...</option>
                        <option th:each="curso : ${cursos}" 
                                th:value="${curso.idCurso}" 
                                th:text="${curso.nomeCurso}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="professor">Professor Responsável</label>
                    <select id="professor" th:field="*{professor}" required>
                        <option value="">Selecione um professor...</option>
                        <option th:each="prof : ${professores}" 
                                th:value="${prof.idProfessor}" 
                                th:text="${prof.nomeProfessor}"></option>
                    </select>
                </div>

                <div style="margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Salvar Disciplina</button>
                    <a th:href="@{/disciplinas/listar}" class="btn btn-secondary" style="text-decoration: none; padding: 0.8rem 1.5rem; display: inline-block;">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
