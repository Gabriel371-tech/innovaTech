spring.application.name=inovatech
server.port=8081

#Configuração do Banco de Dados
spring.datasource.url=jdbc:postgresql://localhost:5432/inovatech_db
spring.datasource.username=postgres
spring.datasource.password=12345678

#Atualiza o esquema do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

#Exibir no terminal o SQL sendo executado
spring.jpa.show-sql=true

#Informa para não formatar o SQL
spring.jpa.properties.hibernate.format_sql=false

#Configurações do Thymeleaf
spring.thymeleaf.cache=false 